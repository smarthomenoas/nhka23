name: Build Nethunter A23 Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      DEFCONFIG: a235m_defconfig
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT_DIR: out

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bison flex libncurses-dev bc \
            python3 python3-pip ccache unzip dwarves \
            gcc-aarch64-linux-gnu crossbuild-essential-arm64 make

      - name: Prepare environment
        run: |
          mkdir -p "${OUT_DIR}"

      - name: Fix prefer_spread_on_idle calls
        run: |
          echo "Reemplazando llamadas a prefer_spread_on_idle con dos argumentos..."
          # Reemplazo global en todos los archivos .c del scheduler
          sed -i -E 's/prefer_spread_on_idle\(([[:space:]]*[^,]+),[[:space:]]*false\)/prefer_spread_on_idle(\1)/g' kernel/sched/*.c
          echo "Diferencias después del fix:"
          git --no-pager diff -- kernel/sched || true

      - name: Apply defconfig
        run: |
          if [ -n "${DEFCONFIG}" ] && [ -f "arch/${ARCH}/configs/${DEFCONFIG}" ]; then
            echo "Usando defconfig ${DEFCONFIG}"
            make O=${OUT_DIR} ${DEFCONFIG}
          else
            echo "Usando olddefconfig por defecto"
            yes "" | make O=${OUT_DIR} olddefconfig || true
          fi

      - name: Build kernel, dtbs, and modules
        env:
          ARCH: ${{ env.ARCH }}
          CROSS_COMPILE: ${{ env.CROSS_COMPILE }}
        run: |
          make O=${OUT_DIR} -j$(nproc)
          make O=${OUT_DIR} dtbs -j$(nproc) || true
          make O=${OUT_DIR} modules -j$(nproc)

      - name: Compress kernel Image
        run: |
          KIMG="${OUT_DIR}/arch/${ARCH}/boot/Image"
          if [ -f "$KIMG" ]; then
            gzip -9 -c "$KIMG" > "${OUT_DIR}/Image.gz"
            echo "Image.gz created"
          else
            echo "No se encontró Image en $KIMG"
          fi

      - name: Package modules
        run: |
          INSTALL_TMP="${OUT_DIR}/modules_tmp"
          mkdir -p "${INSTALL_TMP}"
          make O=${OUT_DIR} modules_install INSTALL_MOD_PATH="${INSTALL_TMP}"
          tar czf "${OUT_DIR}/modules_${GITHUB_RUN_ID}.tar.gz" -C "${INSTALL_TMP}" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            ${OUT_DIR}/Image.gz
            ${OUT_DIR}/arch/${ARCH}/boot/dts/**/*.dtb
            ${OUT_DIR}/arch/${ARCH}/boot/dts/**/*.dtbo
            ${OUT_DIR}/modules_${GITHUB_RUN_ID}.tar.gz
            ${OUT_DIR}/System.map
            ${OUT_DIR}/.config

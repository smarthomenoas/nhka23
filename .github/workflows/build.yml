name: Build Nethunter A23 Kernel (Full Fix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT_DIR: out
      DEFCONFIG: a23_eur_open_defconfig

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libncurses-dev bc \
            python3 python3-pip ccache unzip dwarves \
            gcc-aarch64-linux-gnu crossbuild-essential-arm64 dtc make

      - name: Setup ccache
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          export USE_CCACHE=1
          ccache -M 5G
          echo "✅ ccache setup complete"

      - name: Prepare output directory
        run: mkdir -p "${OUT_DIR}"

      - name: Patch prefer_spread_on_idle
        run: |
          sed -i -E 's/prefer_spread_on_idle\(([[:space:]]*[^,()]+)\)/prefer_spread_on_idle(\1, false)/g' kernel/sched/fair.c
          git --no-pager diff -- kernel/sched/fair.c || true

      - name: Apply DTBO fixes
        run: |
          chmod +x fix_dtbo.sh
          ./fix_dtbo.sh
          # Fix head -n issue in Makefile.dtbo
          sed -i -E 's/head -n[[:space:]]*$/head -n 1/' scripts/Makefile.dtbo

      - name: Apply extern inline fixes
        run: |
          chmod +x fix_extern_inline.sh
          ./fix_extern_inline.sh

      - name: Apply defconfig
        run: make O=${OUT_DIR} $DEFCONFIG

      - name: Build kernel, dtbs, and modules
        run: |
          set -e
          echo "Building kernel..."
          make O=${OUT_DIR} -j$(nproc)
          echo "Building dtbs..."
          make O=${OUT_DIR} dtbs -j$(nproc)
          echo "Building modules..."
          make O=${OUT_DIR} modules -j$(nproc)

      - name: Verify artifacts
        run: |
          IMAGE="${OUT_DIR}/arch/${ARCH}/boot/Image"
          MODULES_TAR="${OUT_DIR}/modules_${GITHUB_RUN_ID}.tar.gz"

          # Compress kernel
          if [ -f "$IMAGE" ]; then
            gzip -9 -c "$IMAGE" > "${OUT_DIR}/Image.gz"
            echo "✅ Image.gz created"
          else
            echo "❌ ERROR: Kernel Image not found!"
            exit 1
          fi

          # Package modules
          TMP_MOD="${OUT_DIR}/modules_tmp"
          mkdir -p "$TMP_MOD"
          make O=${OUT_DIR} modules_install INSTALL_MOD_PATH="$TMP_MOD"
          tar czf "$MODULES_TAR" -C "$TMP_MOD" .
          if [ -f "$MODULES_TAR" ]; then
            echo "✅ Modules tar created"
          else
            echo "❌ ERROR: Modules tar not created!"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            ${OUT_DIR}/Image.gz
            ${OUT_DIR}/arch/${ARCH}/boot/dts/**/*.dtb
            ${OUT_DIR}/arch/${ARCH}/boot/dts/**/*.dtbo
            ${OUT_DIR}/modules_${GITHUB_RUN_ID}.tar.gz
            ${OUT_DIR}/System.map
            ${OUT_DIR}/.config

      - name: Build summary
        run: |
          echo "=== Build completed successfully ==="
          echo "Artifacts available:"
          ls -lh ${OUT_DIR} | grep -E 'Image.gz|modules_'

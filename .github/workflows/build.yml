name: Build Nethunter A23 Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT_DIR: out
      DEFCONFIG: a23_eur_open_defconfig

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bison flex libncurses-dev bc \
            python3 python3-pip ccache unzip dwarves \
            gcc-aarch64-linux-gnu crossbuild-essential-arm64 make

      - name: Setup ccache
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          export USE_CCACHE=1
          ccache -M 5G
          echo "ccache setup complete"

      - name: Prepare output directory
        run: mkdir -p "${OUT_DIR}"

      - name: Fix prefer_spread_on_idle calls
        run: |
          echo "Patching prefer_spread_on_idle calls to ensure 2 arguments..."
          sed -i -E 's/prefer_spread_on_idle\(([[:space:]]*[^,()]+)\)/prefer_spread_on_idle(\1, false)/g' kernel/sched/fair.c
          echo "Diff after patch:"
          git --no-pager diff -- kernel/sched/fair.c || true

      - name: Apply defconfig
        run: |
          echo "Applying defconfig $DEFCONFIG"
          make O=${OUT_DIR} $DEFCONFIG

      - name: Build kernel, dtbs, and modules
        run: |
          make O=${OUT_DIR} -j$(nproc)
          make O=${OUT_DIR} dtbs -j$(nproc) || true
          make O=${OUT_DIR} modules -j$(nproc)

      - name: Compress kernel Image
        run: |
          KIMG="${OUT_DIR}/arch/${ARCH}/boot/Image"
          if [ -f "$KIMG" ]; then
            gzip -9 -c "$KIMG" > "${OUT_DIR}/Image.gz"
            echo "Image.gz created successfully"
          else
            echo "No Image found at $KIMG"
          fi

      - name: Package modules
        run: |
          TMP_MOD="${OUT_DIR}/modules_tmp"
          mkdir -p "${TMP_MOD}"
          make O=${OUT_DIR} modules_install INSTALL_MOD_PATH="${TMP_MOD}"
          tar czf "${OUT_DIR}/modules_${GITHUB_RUN_ID}.tar.gz" -C "${TMP_MOD}" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            ${OUT_DIR}/Image.gz
            ${OUT_DIR}/arch/${ARCH}/boot/dts/**/*.dtb
            ${OUT_DIR}/arch/${ARCH}/boot/dts/**/*.dtbo
            ${OUT_DIR}/modules_${GITHUB_RUN_ID}.tar.gz
            ${OUT_DIR}/System.map
            ${OUT_DIR}/.config
